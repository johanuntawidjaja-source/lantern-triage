name: test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/generate_data.py
      - run: python scripts/evaluate.py
      - run: python scripts/robustness.py
      - run: python scripts/randomized_evaluation.py --seed 20261021 --output evaluation/randomized-iteration-3.json
      - run: python scripts/randomized_evaluation.py --seed 20261022 --output evaluation/randomized-iteration-4.json
      - run: python scripts/verify_human_review.py
      - run: python scripts/changed_requirement.py
      - run: python scripts/new_category_experiment.py
      - run: python -m unittest discover -s tests -v

